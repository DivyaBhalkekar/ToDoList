<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TodoList Using Javascript</title>
    <link rel="stylesheet" href="toDo.css" />
  </head>
  <body>
    <div class="container">
      <h1>Todo Lists</h1>
      <div class="todoApp">
        <input type="text" name="" id="inputfield" placeholder="Enter a Task"  />
        <button id="addTask">Add Task</button>

        <div class="taskLists">
          <ul class="listContainer">
            <!-- here we will generate lists dynamically -->
          </ul>
        </div>
      </div>
    </div>

    <script src="./toDo.js"></script>
  </body>
</html>
